name: Course saving database integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  postgres-save:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: test
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL client
        run: command -v psql >/dev/null || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - name: Check atomic course save against PostgreSQL 17
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/sql/course-save-schema.sql
          psql -v ON_ERROR_STOP=1 -f db/course_builder_safe_save.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/course-save-tests.sql
