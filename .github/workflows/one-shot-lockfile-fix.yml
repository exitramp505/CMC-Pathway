name: Patch vulnerable locked dependencies

on:
  push:
    branches: [fix/lockfile-security-2026-10]
    paths:
      - '.github/workflows/one-shot-lockfile-fix.yml'

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Patch vulnerable packages within allowed version ranges
        run: npm audit fix --package-lock-only || true
      - run: npm ci
      - run: npm test
      - name: Report remaining advisories
        run: npm audit --omit=dev --audit-level=high || true
      - name: Commit safe lockfile updates to this review branch
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile update available"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Update lockfile with nonbreaking security fixes"
          git push
