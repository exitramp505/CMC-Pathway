name: CMC Pathway checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Review dependency security advisories
        run: npm audit --omit=dev --audit-level=high || true
      - run: npm run build:styles:check
      - run: npm test
