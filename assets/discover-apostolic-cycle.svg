<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">The cycle of apostolic ministry</title>
  <desc id="desc">Missionaries are sent, disciples are made, community is formed, and a church is established. The established church then sends missionaries again.</desc>
  <defs>
    <marker id="arrow-ember" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M1 1l9 5-9 5z" fill="#EA9F43"/>
    </marker>
    <marker id="arrow-sage" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M1 1l9 5-9 5z" fill="#4DA79C"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#293D48" flood-opacity=".14"/>
    </filter>
  </defs>

  <rect width="1200" height="820" rx="46" fill="#FBF0DE"/>
  <g opacity=".23" fill="#293D48">
    <circle cx="52" cy="52" r="3"/><circle cx="76" cy="52" r="3"/><circle cx="100" cy="52" r="3"/>
    <circle cx="52" cy="76" r="3"/><circle cx="76" cy="76" r="3"/><circle cx="100" cy="76" r="3"/>
    <circle cx="1100" cy="744" r="3"/><circle cx="1124" cy="744" r="3"/><circle cx="1148" cy="744" r="3"/>
    <circle cx="1100" cy="768" r="3"/><circle cx="1124" cy="768" r="3"/><circle cx="1148" cy="768" r="3"/>
  </g>

  <text x="600" y="72" text-anchor="middle" fill="#EA9F43" font-family="Montserrat, Arial, sans-serif" font-size="18" font-weight="800" letter-spacing="5">THE APOSTOLIC PATTERN</text>
  <text x="600" y="122" text-anchor="middle" fill="#293D48" font-family="Montserrat, Arial, sans-serif" font-size="38" font-weight="900">Sent. Made. Formed. Established.</text>

  <g fill="none" stroke-linecap="round" stroke-width="17">
    <path d="M720 230C850 254 926 323 947 420" stroke="#EA9F43" marker-end="url(#arrow-ember)"/>
    <path d="M930 532C877 640 787 688 690 696" stroke="#4DA79C" marker-end="url(#arrow-sage)"/>
    <path d="M510 696C390 677 304 613 274 520" stroke="#EA9F43" marker-end="url(#arrow-ember)"/>
    <path d="M276 386C319 286 407 233 510 220" stroke="#4DA79C" marker-end="url(#arrow-sage)"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="450" y="160" width="300" height="118" rx="28" fill="#293D48"/>
    <rect x="862" y="352" width="300" height="118" rx="28" fill="#4DA79C"/>
    <rect x="450" y="618" width="300" height="118" rx="28" fill="#293D48"/>
    <rect x="38" y="352" width="300" height="118" rx="28" fill="#EA9F43"/>
  </g>

  <g font-family="Montserrat, Arial, sans-serif" font-weight="900" font-size="25">
    <text x="600" y="210" text-anchor="middle" fill="#FBF0DE">MISSIONARIES</text>
    <text x="600" y="243" text-anchor="middle" fill="#FBF0DE">SENT</text>
    <text x="1012" y="402" text-anchor="middle" fill="#FFFFFF">DISCIPLES</text>
    <text x="1012" y="435" text-anchor="middle" fill="#FFFFFF">MADE</text>
    <text x="600" y="668" text-anchor="middle" fill="#FBF0DE">COMMUNITY</text>
    <text x="600" y="701" text-anchor="middle" fill="#FBF0DE">FORMED</text>
    <text x="188" y="402" text-anchor="middle" fill="#111111">CHURCH</text>
    <text x="188" y="435" text-anchor="middle" fill="#111111">ESTABLISHED</text>
  </g>

  <circle cx="600" cy="458" r="150" fill="#293D48"/>
  <circle cx="600" cy="458" r="133" fill="none" stroke="#FBF0DE" stroke-opacity=".25" stroke-width="2"/>
  <text x="600" y="425" text-anchor="middle" fill="#EA9F43" font-family="Montserrat, Arial, sans-serif" font-size="15" font-weight="900" letter-spacing="4">THE CYCLE</text>
  <text x="600" y="472" text-anchor="middle" fill="#FBF0DE" font-family="Montserrat, Arial, sans-serif" font-size="31" font-weight="900">CONTINUES</text>
  <text x="600" y="510" text-anchor="middle" fill="#FBF0DE" fill-opacity=".72" font-family="Montserrat, Arial, sans-serif" font-size="15" font-weight="650">Each church raises and sends</text>
  <text x="600" y="534" text-anchor="middle" fill="#FBF0DE" fill-opacity=".72" font-family="Montserrat, Arial, sans-serif" font-size="15" font-weight="650">new leaders into mission.</text>
</svg>
