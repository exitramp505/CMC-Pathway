<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Manage Leaders | CMC Pathway</title>
  <link rel="stylesheet" href="style.css?v=112">
</head>
<body class="cmcPathwayBody">
<header class="cmcHeader">
  <a class="cmcBrand" href="leader.html" aria-label="CMC Pathway national home">
    <img class="cmcLogoImage" src="cmc-logo-mark.svg" alt="">
    <span><strong>CMC Pathway</strong><small>Church Multiplication Collective</small></span>
  </a>
  <nav id="cmcRoleNav" class="cmcNav"></nav>
</header>

<main class="cmcManageLeadersMain">
  <section class="cmcManageLeadersIntro">
    <p class="cmcEyebrow">NATIONAL ADMINISTRATION</p>
    <h1>Manage regional leaders.</h1>
    <p>Choose an existing CMC Pathway account, assign its Open Bible region, and grant regional dashboard access.</p>
  </section>

  <section class="cmcLeaderManagement">
    <form id="leaderAccessForm" class="cmcLeaderAccessForm">
      <label>
        <span>Account</span>
        <select id="leaderAccount" required>
          <option value="">Choose an existing account</option>
        </select>
      </label>
      <label>
        <span>Open Bible region</span>
        <select id="leaderRegion" required>
          <option value="">Choose a region</option>
        </select>
      </label>
      <button type="submit">Grant regional access</button>
    </form>
    <p id="leaderAccessMessage" class="cmcLeaderAccessMessage" aria-live="polite"></p>

    <div class="cmcCurrentLeadersHeading">
      <h2>Current regional leaders</h2>
      <span id="regionalLeaderCount">0</span>
    </div>
    <div id="regionalLeaderList" class="cmcCurrentLeaderList">
      <p class="cmcLeaderEmpty">Loading regional leaders…</p>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js?v=112"></script>
<script src="manage-leaders.js?v=82"></script>
</body>
</html>
