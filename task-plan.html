<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Task Plan | CMC Pathway</title><link rel="stylesheet" href="style.css?v=126"></head><body class="cmcPathwayBody"><header class="cmcHeader"><a class="cmcBrand" href="dashboard.html"><img class="cmcLogoImage" src="cmc-logo-mark.svg" alt=""><span><strong>CMC Pathway</strong><small>Church Multiplication Collective</small></span></a><nav id="cmcRoleNav" class="cmcNav"></nav></header>
<main class="cmcTaskPlanMain"><section id="taskPlanHero" class="cmcTaskPlanHero"><div><p class="cmcEyebrow">DEPLOY · TASK PLAN</p><h1 id="taskPlanName">Loading task plan…</h1><p id="taskPlanDescription"></p></div><div class="cmcTaskPlanProgress"><strong id="taskPlanProgress">0%</strong><div><i id="taskPlanProgressBar"></i></div><span id="taskPlanProgressCaption">Loading progress</span></div></section><section id="taskPlanLeaderTools" class="cmcTaskPlanLeaderTools hidden"><div><p class="cmcEyebrow">LEADER TOOLS</p><strong>Adjust this participant’s copy without changing the master template.</strong><span id="taskPlanUpdateSummary"></span></div><div><button id="addCustomPlanTask" class="cmcSecondaryButton" type="button">Add custom task</button><button id="applyTaskPlanUpdate" class="cmcPrimaryButton hidden" type="button">Review template update</button></div></section><nav class="cmcTaskPlanViewTabs"><button class="active" data-plan-view="list">Task list</button><button data-plan-view="timeline">Timeline</button><button data-plan-view="completed">Completed</button></nav><section id="taskPlanContent" class="cmcTaskPlanContent"><p>Loading tasks…</p></section></main>
<dialog id="taskPlanTaskDialog" class="cmcReviewDialog"><form method="dialog" class="cmcReviewDialogCard"><button class="cmcReviewDialogClose" value="cancel">×</button><p class="cmcEyebrow" id="taskDialogPhase">TASK</p><h2 id="taskDialogTitle">Task</h2><div id="taskDialogDescription" class="cmcTaskDialogDescription"></div><div id="taskDialogDates" class="cmcTaskDialogDates"></div><a id="taskDialogResource" class="cmcSecondaryButton hidden" target="_blank" rel="noopener">Open resource ↗</a><div id="leaderTaskFields" class="cmcTaskLeaderFields hidden"><label>Task title<input id="leaderTaskTitle"></label><label class="wide">Instructions<textarea id="leaderTaskDescription" rows="5"></textarea></label><label>Start date<input id="leaderTaskStart" type="date"></label><label>Due date<input id="leaderTaskDue" type="date"></label><label>Priority<select id="leaderTaskPriority"><option value="1">1 · Highest</option><option value="2">2 · High</option><option value="3">3 · Normal</option><option value="4">4 · Low</option><option value="5">5 · Lowest</option></select></label><label>Status<select id="leaderTaskStatus"><option value="not_started">Not started</option><option value="in_progress">In progress</option><option value="blocked">Blocked</option><option value="pending_review">Awaiting approval</option><option value="completed">Completed</option><option value="not_applicable">Not applicable</option></select></label></div><div class="cmcReviewActions"><button class="cmcSecondaryButton" value="cancel">Close</button><button id="completeTaskButton" class="cmcPrimaryButton" type="button">Mark complete</button></div><p id="taskDialogMessage" class="cmcAdminMessage"></p></form></dialog>
<dialog id="customTaskDialog" class="cmcReviewDialog"><form method="dialog" class="cmcReviewDialogCard"><button class="cmcReviewDialogClose" value="cancel">×</button><p class="cmcEyebrow">CUSTOM TASK</p><h2>Add work to this plan</h2><div class="cmcTaskLeaderFields"><label>Task title<input id="customTaskTitle"></label><label class="wide">Instructions<textarea id="customTaskDescription" rows="4"></textarea></label><label>Phase or section<input id="customTaskSection" value="Custom tasks"></label><label>Due date<input id="customTaskDue" type="date"></label><label>Priority<select id="customTaskPriority"><option value="1">1 · Highest</option><option value="2">2 · High</option><option value="3" selected>3 · Normal</option><option value="4">4 · Low</option><option value="5">5 · Lowest</option></select></label></div><div class="cmcReviewActions"><button class="cmcSecondaryButton" value="cancel">Cancel</button><button id="saveCustomPlanTask" class="cmcPrimaryButton" type="button">Add task</button></div><p id="customTaskMessage" class="cmcAdminMessage"></p></form></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js?v=125"></script><script src="task-plan.js?v=1"></script></body></html>
