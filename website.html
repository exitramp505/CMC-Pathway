<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Website | CMC Pathway</title>
  <link rel="stylesheet" href="style.css?v=128">
</head>
<body class="cmcPathwayBody">
<header class="cmcHeader">
  <a class="cmcBrand" href="dashboard.html" aria-label="CMC Pathway home">
    <img class="cmcLogoImage" src="cmc-logo-mark.svg" alt="">
    <span><strong>CMC Pathway</strong><small>Church Multiplication Collective</small></span>
  </a>
  <nav id="cmcRoleNav" class="cmcNav"></nav>
</header>
<main class="cmcPathwayMain cmcWebsiteMain">
  <section class="cmcAdminPageHero cmcWebsiteHero">
    <div><p class="cmcEyebrow">PUBLIC WEBSITE</p><h1>Website</h1><p>Update the people, resources, models, and Discover content shown on the public CMC website.</p></div>
    <a class="cmcSecondaryButton cmcAdminPageAction" href="https://cmcopenbible.netlify.app" target="_blank" rel="noreferrer">View website <span>↗</span></a>
  </section>

  <section class="cmcWebsiteWorkspace">
    <nav class="cmcWebsiteTabs" aria-label="Website sections">
      <button class="active" type="button" data-site-tab="team">Team</button>
      <button type="button" data-site-tab="resources">Resources</button>
      <button type="button" data-site-tab="models">Models</button>
      <button type="button" data-site-tab="discern">Discernment</button>
      <a href="events.html">Events ↗</a>
    </nav>
    <header class="cmcWebsiteSectionHeader">
      <div><p id="websiteSectionEyebrow" class="cmcEyebrow">ABOUT PAGE</p><h2 id="websiteSectionTitle">CMC team</h2><p id="websiteSectionHelp">Manage the people shown on the public About page.</p></div>
      <div class="cmcWebsiteStatus"><span id="websiteDraftStatus">Loading…</span><small id="websitePublishedAt"></small></div>
    </header>
    <p id="websiteMessage" class="cmcAdminMessage" role="status"></p>
    <form id="websiteEditor" class="cmcWebsiteEditor"></form>
    <footer class="cmcWebsiteActions">
      <button id="saveWebsiteDraft" class="cmcSecondaryButton" type="button">Save draft</button>
      <button id="publishWebsiteSection" class="cmcPrimaryButton" type="button">Publish changes</button>
    </footer>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js?v=128"></script>
<script src="website.js?v=1"></script>
</body>
</html>
